<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>html,body{margin:0;background:#07080b;-webkit-tap-highlight-color:transparent}body{min-height:100vh}*{box-sizing:border-box}</style>
<script>
// photos taken in check-ins are kept in this phone's IndexedDB and served to <img> by the service worker
function pbIDB(){return new Promise((res,rej)=>{const r=indexedDB.open('plateandbar',1);r.onupgradeneeded=()=>r.result.createObjectStore('blobs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
window.LOCAL_ASSETS={async upload(blob){const id='local-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);const db=await pbIDB();
  await new Promise((res,rej)=>{const tx=db.transaction('blobs','readwrite');tx.objectStore('blobs').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return{id,url:'blob/'+id+'.jpg'}}};
window.PB_VER='bd5a8874';
// check for a new version on every open; when the new service worker takes over, reload once onto it
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;let done=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;location.reload()}});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></head><body>
<title>Plate &amp; Bar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working column (max 980px). Top bar with tabs; on phones the tabs drop to a bottom bar. Cards only for working surfaces. */
:root{
  --bg:#ECEFF3;--surface:#FFFFFF;--sunk:#F3F5F8;--ink:#121821;--muted:#5A6577;--line:#D6DCE4;
  --accent:#2B47D9;--accent-ink:#FFFFFF;--accent-soft:#E2E7FF;
  --pro:#C8410B;--carb:#0B8577;--fat:#A97A00;--good:#23824A;--warn:#B4530A;--bad:#C0322B;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A;--surface:#161D27;--sunk:#1C2531;--ink:#E6EBF2;--muted:#94A1B4;--line:#2A3544;
  --accent:#8297FF;--accent-ink:#0E131A;--accent-soft:#232C4A;
  --pro:#FF7B45;--carb:#2CC2B0;--fat:#E5B630;--good:#4CC17A;--warn:#F0954A;--bad:#FF6B61;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A;--surface:#161D27;--sunk:#1C2531;--ink:#E6EBF2;--muted:#94A1B4;--line:#2A3544;
  --accent:#8297FF;--accent-ink:#0E131A;--accent-soft:#232C4A;
  --pro:#FF7B45;--carb:#2CC2B0;--fat:#E5B630;--good:#4CC17A;--warn:#F0954A;--bad:#FF6B61;color-scheme:dark}

html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.4rem}h3{font-size:1.1rem}
small{color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}.sm{font-size:.85rem}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:20px;min-height:58px}
.brand{font-family:var(--display);font-weight:700;font-size:1.55rem;letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:4px;flex:1}
.tabs button{background:none;border:0;font:600 .95rem var(--body);color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.tabs button:hover{color:var(--ink)}
.sync{font-size:.75rem;color:var(--muted);white-space:nowrap}
@media (max-width:720px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabs button{flex:1;padding:10px 4px}
  main.wrap{padding-bottom:96px}
  .sync{display:none}
  h1{font-size:1.7rem}
}
main.wrap{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}

/* controls */
button{font-family:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:9px 14px;font:600 .9rem var(--body);cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:6px 10px;font-size:.82rem}
.btn.xs{padding:3px 8px;font-size:.76rem;border-radius:6px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.danger,.iconbtn.danger{color:var(--bad)}
.btn.armed,.iconbtn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled,.iconbtn:disabled{opacity:.4;cursor:default}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;min-width:34px;height:34px;padding:0 8px;cursor:pointer;font-size:1rem;line-height:1}
.iconbtn:hover{background:var(--sunk)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
textarea{resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
label.inline{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:.9rem}
.form{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.search{margin-bottom:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip-train{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.chip-rest{background:var(--sunk)}
.chip.good{color:var(--good);border-color:currentColor;background:transparent}
.chip.warn{color:var(--warn);border-color:currentColor;background:transparent}
.chip.bad{color:var(--bad);border-color:currentColor;background:transparent}
.subnav{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.subnav button{background:none;border:1px solid transparent;border-radius:999px;padding:6px 14px;font:600 .88rem var(--body);color:var(--muted);cursor:pointer}
.subnav button.on{border-color:var(--ink);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.seg button{background:var(--surface);border:0;padding:7px 12px;font:600 .82rem var(--body);color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* today */
.dayhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dayhead .grow{flex:1;min-width:150px}
.macrowrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--sunk);stroke-width:12}
.ring .val{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round}
.ring .val.over{stroke:var(--warn)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .lbl b{font:500 1.35rem var(--mono)}
.bars{flex:1;min-width:180px;display:flex;flex-direction:column;gap:10px}
.bar .bt{display:flex;justify-content:space-between;font-size:.82rem}
.bar .bt span:last-child{font-family:var(--mono)}
.bar .bg{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:3px}
.bar .bg i{display:block;height:100%;border-radius:4px}
.bar.p i{background:var(--pro)}.bar.c i{background:var(--carb)}.bar.f i{background:var(--fat)}
.wcard{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.wcard .grow{flex:1;min-width:0}
.wcard.done{border-color:var(--good)}
.meal{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0;padding-top:0}
.mealhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lrow{display:flex;align-items:center;gap:8px;padding:7px 0}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow .grow small{font-family:var(--mono);font-size:.74rem}
.lrow input[type=number]{width:74px;flex:none}
.lrow .unit{font-size:.78rem;color:var(--muted)}
.planned{border-left:3px solid var(--accent);padding-left:10px}
.resume{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--ink);color:var(--bg);border:0;border-radius:var(--r);padding:12px 16px;font:500 .95rem var(--body);cursor:pointer;text-align:left}

/* builder & live */
.bhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bhead h1{flex:1}
.sec{gap:10px}
.sechead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sechead .sectitle{flex:1;min-width:140px;font:700 1.2rem var(--display);border-color:transparent;background:var(--sunk)}
.sechead select{width:auto}
.sechead h2{flex:1}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.secset{display:flex;gap:10px;flex-wrap:wrap}
.secset label{width:130px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.item.linked{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:-11px;border-bottom-style:dashed}
.itemhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lab{font:500 .8rem var(--mono);background:var(--ink);color:var(--bg);border-radius:5px;padding:2px 6px;min-width:28px;text-align:center}
.exname{background:none;border:0;padding:0;font:600 1rem var(--body);color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.itemhead .grow{flex:1;min-width:120px}
.stable{overflow-x:auto}
.stable table{border-collapse:collapse;width:100%;min-width:360px}
.stable th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:2px 4px;font-weight:600}
.stable td{padding:3px 4px}
.stable input,.stable select{padding:5px 7px}
.stable select{width:auto}
.itemfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.itemfoot label{flex-direction:row;align-items:center;gap:6px}
.itemfoot input{width:80px}
.addsec{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.livehead{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;justify-content:space-between}
.lset{display:grid;grid-template-columns:34px minmax(70px,1.2fr) repeat(var(--nf),minmax(64px,1fr)) 44px;gap:6px;align-items:center;padding:3px 0}
.lset.hd{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.lset input{text-align:center;font-family:var(--mono);padding:8px 4px}
.lset input.sug{color:var(--muted);font-style:italic}
.lset .tgt{font:500 .8rem var(--mono);color:var(--muted)}
.lset.done input{background:var(--accent-soft);border-color:transparent;color:var(--ink);font-style:normal}
.stype{font:500 .8rem var(--mono);text-align:center;border-radius:5px;padding:4px 0;background:var(--sunk)}
.stype.t-W{color:var(--warn)}.stype.t-D{color:var(--carb)}.stype.t-F{color:var(--bad)}
.tick{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.05rem;color:var(--muted)}
.lset.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.hist{font:500 .78rem var(--mono);color:var(--muted);background:var(--sunk);border-radius:6px;padding:6px 8px}
.liveFoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 10px 8px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#restbar button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:5px 10px;cursor:pointer;font:600 .8rem var(--body)}
#timer{position:fixed;inset:0;z-index:60;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));text-align:center}
#timer .phase{font:700 1.2rem var(--display);letter-spacing:.2em;text-transform:uppercase}
#timer .phase.rest{color:var(--carb)}
#timer .big{font:500 clamp(4rem,22vw,9rem) var(--mono);line-height:1}
#timer .ex{font:700 clamp(1.6rem,6vw,2.6rem) var(--display)}
#timer .tools button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:10px;padding:10px 18px;font:600 1rem var(--body);cursor:pointer}
#timer .tools button.prim{background:var(--bg);color:var(--ink)}
.counter{display:flex;align-items:center;gap:18px}
.counter b{font:500 3rem var(--mono)}

/* nutrition */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.plan{border-collapse:collapse;width:100%;min-width:860px}
table.plan th,table.plan td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;vertical-align:top}
table.plan th{font-size:.78rem;text-align:left;background:var(--sunk)}
table.plan th.rowh{width:88px}
table.plan td:last-child,table.plan th:last-child{border-right:0}
.dh{display:flex;justify-content:space-between;align-items:center;gap:4px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:4px}
.dot.t{background:var(--accent)}
.pchip{display:block;width:100%;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:5px 7px;margin-bottom:4px;font:500 .8rem var(--body);color:var(--ink);cursor:pointer}
.pchip small{display:block;font-family:var(--mono);font-size:.7rem}
.padd{width:100%;border:1px dashed var(--line);background:transparent;border-radius:6px;color:var(--muted);cursor:pointer;padding:3px}
.tot td{font:500 .76rem var(--mono);background:var(--sunk)}
.tot .good{color:var(--good)}.tot .warn{color:var(--warn)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;font:inherit;color:inherit}
.rcard:hover{border-color:var(--accent)}
.rcard b{font-size:1rem}
.macrotxt{font:500 .76rem var(--mono);color:var(--muted)}
.macrotxt .p{color:var(--pro)}.macrotxt .c{color:var(--carb)}.macrotxt .f{color:var(--fat)}
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.calc{font:500 .85rem var(--mono);background:var(--sunk);border-radius:8px;padding:10px 12px;color:var(--ink)}
.shop{columns:2 260px;column-gap:24px}
.shop .grp{break-inside:avoid;margin-bottom:14px}
.shop label{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:.92rem;padding:4px 0}
.shop label.got span{text-decoration:line-through;color:var(--muted)}

/* calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:820px){.week{grid-template-columns:1fr}}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.wday.today{border-color:var(--accent)}
.wday .dl{font-weight:600;font-size:.82rem;display:flex;justify-content:space-between}
.cchip{display:flex;align-items:center;gap:4px;border-radius:6px;padding:4px 6px;font-size:.8rem;background:var(--sunk);border:1px solid var(--line)}
.cchip button.n{flex:1;background:none;border:0;padding:0;text-align:left;color:var(--ink);font:500 .8rem var(--body);cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cchip button.x{background:none;border:0;color:var(--muted);cursor:pointer}
.cchip.done{border-color:var(--good)}.cchip.done::before{content:"✓";color:var(--good);font-weight:700}
.cchip.missed{border-color:var(--bad);opacity:.8}
.wday select{font-size:.78rem;padding:4px}
.progtable{overflow-x:auto}
.progtable table{border-collapse:collapse;min-width:720px;width:100%}
.progtable td,.progtable th{padding:4px;font-size:.8rem;text-align:left}
.progtable select{font-size:.8rem;padding:4px}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font:500 1.7rem var(--mono)}
.chart{width:100%;height:auto;display:block}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .area{fill:var(--accent);opacity:.12}
.chart .grid line{stroke:var(--line)}
.chart text{fill:var(--muted);font:12px var(--mono)}
.chart .end{fill:var(--accent)}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,12,18,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:min(640px,100%);max-height:min(88vh,860px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
@media (max-width:720px){.modal{align-items:flex-end;padding:0}.sheet{border-radius:14px 14px 0 0;max-height:92vh;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mlist{display:flex;flex-direction:column}
.pickrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:9px 2px;text-align:left;cursor:pointer;color:inherit;font:inherit}
.pickrow:hover{background:var(--sunk)}
.pickrow.sel{background:var(--accent-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 10px;font:600 .78rem var(--body);cursor:pointer}
.chips button.on{border-color:var(--ink);color:var(--ink);background:var(--sunk)}
.stars button{background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--line);padding:0 2px}
.stars button.on{color:var(--fat)}
.pr{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--accent-soft)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:70;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:500;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}

/* exercise figures */
.fig{display:block;width:100%;height:auto}
.fig line{stroke-linecap:round}
.fig .limb{stroke:var(--ink);stroke-width:7}
.fig .torso{stroke:var(--ink);stroke-width:12}
.fig .far{stroke:var(--muted);stroke-width:6;opacity:.5}
.fig .ft{stroke-width:5}
.fig .head{fill:var(--ink)}
.fig .gnd{stroke:var(--line);stroke-width:2}
.fig .plate{fill:var(--accent)}.fig .hole{fill:var(--surface)}
.fig .eqf{fill:var(--accent)}.fig .far2{opacity:.45}
.fig .eqs{fill:none;stroke:var(--accent);stroke-width:3}
.fig .gear{fill:var(--sunk);stroke:var(--muted);stroke-width:1.5}
.fig .gearw{stroke:var(--muted);stroke-width:7;opacity:.55}
.fig .gearl{stroke:var(--muted);stroke-width:3;opacity:.55}
.fig .cable{stroke:var(--accent);stroke-width:1.8;fill:none;stroke-dasharray:4 3}
.fig .cable.solid{stroke-dasharray:none;stroke-width:2}
.fig .wheel{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.figbox{background:var(--sunk);border-radius:10px;padding:4px;flex:none}
.figbtn{background:var(--sunk);border:0;border-radius:8px;padding:2px;cursor:pointer;flex:none;width:64px;height:64px}
.figbtn:hover{outline:2px solid var(--accent)}
.figstrip{display:flex;gap:6px}
.figstrip .figbox{width:52px;height:52px;padding:2px}
#timer .fig{width:min(42vw,220px)}
#timer .fig .limb,#timer .fig .torso{stroke:var(--bg)}
#timer .fig .head{fill:var(--bg)}
#timer .fig .gnd{stroke:var(--muted)}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;font:inherit;color:inherit}
.excard:hover{border-color:var(--accent)}
.excard .figbox{aspect-ratio:1}
.excard b{font-size:.9rem;line-height:1.25}
.exinfo{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:center}
@media (max-width:560px){.exinfo{grid-template-columns:1fr}}
.cues{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.mm{width:100%;height:auto;display:block}
.mm .base{fill:var(--sunk);stroke:var(--line);stroke-width:1}
.mm .mu{fill:var(--line)}
.mm .mp{fill:var(--accent)}
.mm .ms{fill:var(--accent);opacity:.4}
.mm text{fill:var(--muted);font:11px var(--body)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:5px;vertical-align:-1px}
.legend i.s{opacity:.4}
video.demo{width:100%;border-radius:10px;background:#000;max-height:360px}
/* photos */
.thumb{width:52px;height:52px;border-radius:8px;overflow:hidden;flex:none;background:var(--sunk);display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font:700 1.3rem var(--display);color:var(--muted)}
.thumb.sm{width:40px;height:40px}
.rcard{padding:0;overflow:hidden}
.rcard .rbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.rcard .rimg{aspect-ratio:4/3;background:var(--sunk);display:flex;align-items:center;justify-content:center;overflow:hidden}
.rcard .rimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.rcard:hover .rimg img{transform:scale(1.04)}
.rcard .rimg .ph{font:700 2.4rem var(--display);color:var(--muted)}
.hero{width:calc(100% + 36px);margin:-18px -18px 0;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:14px 14px 0 0}
.pchip img{display:block;width:100%;height:46px;object-fit:cover;border-radius:4px;margin-bottom:4px}
@media (prefers-reduced-motion:reduce){.rcard .rimg img{transition:none}}
[hidden]{display:none!important}
/* exercise photos, guides, 12-week build */
.exph{display:block;width:100%;height:100%;object-fit:cover;border-radius:6px;background:#1c1c1e}
.excard .figbox{padding:0;overflow:hidden}
.hero.exhero{aspect-ratio:4/3;background:#1c1c1e;object-fit:contain}
.phcap{margin-top:-6px;text-align:center}
.guide{display:flex;flex-direction:column;gap:12px}.guide p{margin:4px 0 0}
.errs{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}.errs li::before{content:"✕  ";color:var(--bad);font-weight:700}
.tipbox{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:.9rem}
.tipbox.good{background:transparent;border-color:var(--good)}.tipbox.warn{background:transparent;border-color:var(--warn)}
.tipbox .btn{margin-left:6px}
.pbar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent)}
.princ{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.princ div{background:var(--sunk);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px}
.princ b{font-family:var(--display);font-size:1.2rem}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.blk{border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.blk.b2{border-top-color:var(--carb)}.blk.b3{border-top-color:var(--pro)}.blk.on{outline:2px solid var(--accent);outline-offset:1px}
.blk b{font-family:var(--display);font-size:1.3rem}
.hday{text-align:left;cursor:pointer;font:inherit;color:inherit}.hday:hover{border-color:var(--accent)}
.hgrid{display:grid;grid-template-columns:40px repeat(var(--nd),minmax(0,1fr));gap:4px;align-items:center}
.hh{font-size:.72rem;color:var(--muted);text-align:center;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hw{font:500 .8rem var(--mono);color:var(--muted)}.hw.cur{color:var(--accent);font-weight:700}
.hc{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:32px;font:500 .72rem var(--mono);color:var(--muted);cursor:pointer;min-width:0;padding:0}
.hc.dl{background:var(--sunk);border-style:dashed}.hc.ts{border-color:var(--pro)}
.hc.done{background:var(--good);border-color:var(--good);color:#fff}.hc.miss{border-color:var(--bad);color:var(--bad)}.hc.today{outline:2px solid var(--accent)}
.legend i.lg.done{background:var(--good)}.legend i.lg.miss{background:transparent;border:1.5px solid var(--bad)}.legend i.lg.dl{background:var(--sunk);border:1.5px dashed var(--muted)}
.vol{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:88px 1fr 84px;gap:8px;align-items:center;font-size:.85rem}
.vtrack{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.vtrack i{position:absolute;top:0;bottom:0;left:0;border-radius:6px}
.vtrack .vz{background:var(--good);opacity:.22;border-radius:0}.vtrack .vp{background:var(--accent);opacity:.3}.vtrack .vd{background:var(--accent)}
.vn{text-align:right;white-space:nowrap}.vn.lo,.vn.hi{color:var(--warn)}
.hex{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.hex.linked{border-bottom-style:dashed}
.hexph{width:112px;height:84px;flex:none;padding:0;border:0;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--sunk)}
.hexph:hover{outline:2px solid var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:600 .8rem var(--body);cursor:pointer;margin-top:2px}
.bump{font-size:.82rem;color:var(--good);font-weight:600}
.hday .figstrip,.wcard .figstrip{overflow:hidden;max-width:100%;min-width:0}.wcard .figstrip{flex:0 1 auto}
.hypnext{flex-wrap:wrap}.hypnext .grow{min-width:150px}@media (max-width:560px){.hypnext .figstrip{display:none}}
@media (max-width:560px){.hexph{width:88px;height:66px}.hgrid{grid-template-columns:30px repeat(var(--nd),minmax(0,1fr))}.hc{font-size:.62rem}}

/* rendered page banners */
.phero{position:relative;border-radius:16px;overflow:hidden;background:#0b0f17;color:#f1f4f9;min-height:230px;display:flex;align-items:flex-end;isolation:isolate;box-shadow:0 14px 40px rgba(5,8,14,.28)}
.phimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center;z-index:-2}
.phero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,11,17,.96) 0%,rgba(8,11,17,.82) 34%,rgba(8,11,17,.18) 66%,rgba(8,11,17,0) 100%)}
.phin{padding:22px 24px;max-width:600px;display:flex;flex-direction:column;gap:8px}
.phero .eyebrow{color:#ff9a6b}.phero h1{font-size:2.5rem;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5)}.phero p{margin:0;color:#c7d0de;max-width:440px}
.phstats{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px}.phstats b{display:block;font:600 1.55rem var(--mono);color:#fff;line-height:1.1}.phstats small{color:#9fadc2;font-size:.74rem}
.phero .btn{align-self:flex-start;margin-top:6px}
@media (max-width:640px){.phero{min-height:330px}.phimg{object-position:72% center}.phero::before{background:linear-gradient(0deg,rgba(8,11,17,.97) 0%,rgba(8,11,17,.8) 48%,rgba(8,11,17,.1) 100%)}.phero h1{font-size:2rem}.phstats{gap:16px}}
/* dark "rendered" chart cards */
.card.dark{background:radial-gradient(120% 140% at 100% 0%,#1d2740 0%,#0c111b 58%);border-color:#1e2a3d;color:#e6ebf2;box-shadow:0 10px 30px rgba(5,8,14,.25)}
.card.dark small,.card.dark .muted{color:#8e9bb1}.card.dark h2{color:#fff}
.card.dark input,.card.dark select{background:#121a28;border-color:#26344a;color:#e6ebf2}
.card.dark .lrow{border-color:#1e2a3d}.card.dark .iconbtn{border-color:#26344a;color:#cfd8e6}
.nchart{width:100%;height:auto;display:block;overflow:visible}
.ngrid line{stroke:#22304a;stroke-dasharray:3 5}.ngrid text,.nax{fill:#7f8ca3;font:11px var(--mono)}
.nline{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out forwards}.narea{opacity:0;animation:fadein 1s .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fadein{to{opacity:1}}
.ndot{fill:#0c111b;stroke:#ff7a45;stroke-width:2}.nend{fill:#fff}.nend-h{fill:#ff5a2e;opacity:.35;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.08}}
.npr path{fill:#ffd166;filter:drop-shadow(0 0 4px #ffb347)}.nbub{fill:#ff5a2e}.nbubt{fill:#fff;font:600 11px var(--mono)}
.vbg{fill:#141c2b}.vbar{transform-origin:bottom;transform-box:fill-box;animation:grow .7s ease-out both}.vlab{fill:#e6ebf2;font:600 11px var(--mono)}
@keyframes grow{from{transform:scaleY(0)}}
.trendrow{display:flex;gap:14px;align-items:center}.trendrow .grow{flex:1;min-width:0}.trph{width:120px;height:90px;border-radius:10px;overflow:hidden;flex:none;box-shadow:0 0 0 1px #26344a}
@media (max-width:560px){.trph{display:none}}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.ring2{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;position:relative}.ring2 svg{width:120px;height:120px}
.rt2{fill:none;stroke:#1a2436;stroke-width:9}.rv2{fill:none;stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,90,46,.6));animation:ringin 1.2s ease-out}
@keyframes ringin{from{stroke-dasharray:0 999}}
.rpct{fill:#fff;font:700 18px var(--display)}.rsub{fill:#8e9bb1;font:10px var(--mono)}
.rph{width:46px;height:34px;border-radius:6px;overflow:hidden;margin-top:-4px}.ring2 b{font-size:.85rem;color:#fff}
.heatwrap{display:flex;justify-content:center}.heat{width:100%;max-width:340px;height:auto}
.heat .hb{fill:#141c2b;stroke:#26344a;stroke-width:1}.heat .hmu{fill:#1f2a3d}.heat text{fill:#7f8ca3;font:11px var(--body)}
.hleg{display:flex;align-items:center;gap:8px;justify-content:center;font-size:.75rem;color:#8e9bb1}.hleg i{display:block;width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,#1f2a3d,#ffaa3c,#ff2d1e)}
.cgrid{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));grid-template-rows:repeat(7,auto);gap:4px}
.cc{display:block;aspect-ratio:1;border-radius:3px;background:#161f2f}.cc.l1{background:#ff7a3c;box-shadow:0 0 6px rgba(255,122,60,.5)}.cc.l2{background:#ff2d1e;box-shadow:0 0 8px rgba(255,45,30,.7)}.cc.fut{background:transparent;outline:1px dashed #1e2a3d}.cc.now{outline:2px solid #5ce1ff}
.cleg{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:.72rem;color:#8e9bb1}.cleg .cc{width:11px}
.tiles.mini .tile{background:#111827;border-color:#1e2a3d}.tiles.mini .tile b{color:#fff;font-size:1.4rem}
/* rest timer */
#restbar{position:fixed;right:16px;left:auto;transform:none;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;background:radial-gradient(130% 130% at 0% 0%,#26324b,#0c111b 70%);color:#fff;border:1px solid #2a3852;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 16px 40px rgba(0,0,0,.45)}
#restbar.ending{border-color:#ff5a2e;box-shadow:0 0 0 2px rgba(255,90,46,.35),0 16px 40px rgba(0,0,0,.45)}
.rwrap{position:relative;width:64px;height:64px;flex:none}.rring{width:64px;height:64px}.rt{fill:none;stroke:#1d283c;stroke-width:6}.rv{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .25s linear;filter:drop-shadow(0 0 4px rgba(255,90,46,.7))}
#restTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 .95rem var(--mono)}
.rinfo{display:flex;flex-direction:column;line-height:1.2}.rinfo small{color:#9fadc2;text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;font-weight:600}.rinfo span{font-size:.8rem;color:#c7d0de}
.rbtns{display:flex;gap:6px}.rbtns button{background:transparent;border:1px solid #3a4a66;color:#e6ebf2;border-radius:999px;padding:7px 10px;cursor:pointer;font:600 .8rem var(--body)}
.rbtns button.prim{background:#ff5a2e;border-color:#ff5a2e;color:#fff}
@media (max-width:720px){#restbar{left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));justify-content:space-between}}
.rpre{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.rp{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:inherit}
.rp:hover{border-color:var(--accent)}.rp b{font:600 1.3rem var(--mono)}

/* ===== premium dark theme: rendered backdrop, glass cards, copper-orange accents ===== */
:root:not([data-pb]){--bg:#06080c;--surface:rgba(18,24,36,.74);--sunk:rgba(255,255,255,.045);--ink:#eef2f7;--muted:#93a0b5;--line:rgba(255,255,255,.085);
  --accent:#ff6a3d;--accent-ink:#fff;--accent-soft:rgba(255,106,61,.14);--pro:#ff7b52;--carb:#2fd3bd;--fat:#f2c14e;--good:#4fd389;--warn:#ffa24a;--bad:#ff6b61;color-scheme:dark;
  --glass:linear-gradient(180deg,rgba(30,39,58,.66),rgba(12,16,25,.78));--glow:0 0 0 1px rgba(255,255,255,.06),0 18px 44px rgba(0,0,0,.45)}
html,body{background:#06080c}
#bgfx{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,8,12,.35) 0%,rgba(6,8,12,.72) 55%,rgba(6,8,12,.9) 100%),url(blob/1d6ad32541282c6dbca0be5a04d4cb81.jpg) center top/cover no-repeat;pointer-events:none}
@media (max-width:720px){#bgfx{background:linear-gradient(180deg,rgba(6,8,12,.3) 0%,rgba(6,8,12,.75) 60%,rgba(6,8,12,.92) 100%),url(blob/57750e69ce26e5fdf6326dd5811c4fcc.jpg) center top/cover no-repeat}}
body::before{background:rgba(8,11,17,.9)}
.top{background:rgba(8,11,17,.72);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid rgba(255,255,255,.07)}
.brand{background:linear-gradient(90deg,#fff 0%,#ffd2bd 55%,#ff7a45 100%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.04em}
.brand span{color:#ff6a3d;-webkit-text-fill-color:#ff6a3d}
.tabs button{display:inline-flex;align-items:center;gap:8px}
.tabs .ti{width:26px;height:26px;border-radius:7px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.08);opacity:.75;transition:opacity .2s,transform .2s}
.tabs button[aria-current="page"]{background:linear-gradient(180deg,rgba(255,106,61,.2),rgba(255,106,61,.06));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,106,61,.35)}
.tabs button[aria-current="page"] .ti,.tabs button:hover .ti{opacity:1;transform:translateY(-1px)}
@media (max-width:720px){.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(8,11,17,.97)}.tabs{background:rgba(8,11,17,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.08)}
  .tabs button{flex-direction:column;gap:3px;font-size:.72rem;padding:6px 2px}.tabs .ti{width:30px;height:30px}}
.iconbtn.tmr{padding:0;overflow:hidden;width:36px;height:36px}.iconbtn.tmr img{width:100%;height:100%;object-fit:cover;display:block}
.card,.excard,.tile,.blk,.empty{background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(255,255,255,.07);box-shadow:var(--glow)}
.card{border-radius:16px;position:relative}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 30%)}
.card>*{position:relative;z-index:1}
.empty{border-style:solid;color:var(--muted)}
.excard{border-radius:14px;transition:transform .2s,box-shadow .2s,border-color .2s}.excard:hover{transform:translateY(-3px);border-color:rgba(255,106,61,.5);box-shadow:0 0 0 1px rgba(255,106,61,.3),0 20px 40px rgba(0,0,0,.5)}
.excard .figbox{border-radius:10px}
h1,h2{color:#fff}h1{letter-spacing:.015em}
.btn{background:linear-gradient(180deg,#ff8a55,#ff5a2e);border-color:#ff6a3d;color:#fff;box-shadow:0 6px 18px rgba(255,90,46,.35),inset 0 1px 0 rgba(255,255,255,.25);border-radius:10px}

const RAD=Math.PI/180;
const v=(o,a,l)=>[o[0]+l*Math.sin(a*RAD),o[1]+l*Math.cos(a*RAD)];
function ik(o,t,l1,l2,bend){let dx=t[0]-o[0],dy=t[1]-o[1];let d=Math.hypot(dx,dy);const md=l1+l2-.01;if(d>md){dx*=md/d;dy*=md/d;d=md}
  const phi=Math.atan2(dx,dy)/RAD;const c=Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d)));const a=phi+bend*Math.acos(c)/RAD;
  const j=v(o,a,l1);const b=Math.atan2(o[0]+dx-j[0],o[1]+dy-j[1])/RAD;return[a,b]}
function pose(p){
  // relative to hip at origin
  const H=[0,0];const t=p.t||0;const Sh=[Math.sin(t*RAD)*SEG.torso,-Math.cos(t*RAD)*SEG.torso];
  const ht=t+(p.hd||0);const Hd=[Sh[0]+Math.sin(ht*RAD)*(SEG.neck+SEG.head),Sh[1]-Math.cos(ht*RAD)*(SEG.neck+SEG.head)];
  let J={H,Sh,Hd};
  const legs=(th,sh,ft)=>{const K=v(H,th,SEG.th),A=v(K,sh,SEG.sh);return[K,A,[A[0]+SEG.ft*Math.cos(ft*RAD),A[1]+SEG.ft*Math.sin(ft*RAD)]]};
  if(!p.ikF){[J.Kn,J.An,J.To]=legs(p.th||0,p.sh||0,p.ft||0);[J.Kn2,J.An2,J.To2]=legs(p.th2??p.th??0,p.sh2??p.sh??0,p.ft2??p.ft??0)}
  // anchor
  let off=[0,0];
  if(p.anc&&p.anc!=='H'){const a=J[p.anc];off=[p.at[0]-a[0],p.at[1]-a[1]]}else off=p.at||[100,110];
  for(const k in J)J[k]=[J[k][0]+off[0],J[k][1]+off[1]];
  // IK legs (world targets)
  if(p.ikF){const bl=p.bendL??-1;const f=p.ft||0,f2=p.ft2??f;
    const [a,b]=ik(J.H,p.ikF,SEG.th,SEG.sh,bl);J.Kn=v(J.H,a,SEG.th);J.An=v(J.Kn,b,SEG.sh);
    const t2=p.ikF2||p.ikF;const [a2,b2]=ik(J.H,t2,SEG.th,SEG.sh,p.bendL2??bl);J.Kn2=v(J.H,a2,SEG.th);J.An2=v(J.Kn2,b2,SEG.sh);
    J.To=[J.An[0]+SEG.ft*Math.cos(f*RAD),J.An[1]+SEG.ft*Math.sin(f*RAD)];J.To2=[J.An2[0]+SEG.ft*Math.cos(f2*RAD),J.An2[1]+SEG.ft*Math.sin(f2*RAD)]}
  // arms
  if(p.ikH){const ba=p.bendA??1;const [a,b]=ik(J.Sh,p.ikH,SEG.ua,SEG.fa,ba);J.El=v(J.Sh,a,SEG.ua);J.Ha=v(J.El,b,SEG.fa);
    const t2=p.ikH2||p.ikH;const [a2,b2]=ik(J.Sh,t2,SEG.ua,SEG.fa,p.bendA2??ba);J.El2=v(J.Sh,a2,SEG.ua);J.Ha2=v(J.El2,b2,SEG.fa)}
  else{const u=p.u||0,f=p.f||0;J.El=v(J.Sh,u,SEG.ua);J.Ha=v(J.El,f,SEG.fa);J.El2=v(J.Sh,p.u2??u,SEG.ua);J.Ha2=v(J.El2,p.f2??f,SEG.fa)}
  return J}

/* ===== 12-week hypertrophy program =====
   Evidence-based design: each muscle trained 2x/week, 10-20 hard sets per muscle per week, mostly 6-15 reps taken within 0-3 reps
   of failure (RIR), double progression (add reps, then load), and planned deloads. Three 4-week blocks: Foundation, Accumulation, Intensification. */
const HYP_DAYS=[
 {name:'Upper A',focus:'Chest & back, horizontal',wd:0,items:[['bp','C'],['csrow','C'],['idb','S'],['pd','S'],['lat','I'],['pushd','I',1],['curl','I']]},
 {name:'Lower A',focus:'Squat & hamstrings',wd:1,items:[['bsq','C'],['rdl','C'],['lp','S'],['lc','I'],['calf','I'],['hlr','K']]},
 {name:'Upper B',focus:'Shoulders & back, vertical',wd:3,items:[['dbsp','C'],['pu','C'],['mcp','S'],['cablerow','S'],['fp','I'],['ohte','I',1],['hcurl','I']]},
 {name:'Lower B',focus:'Glutes & quads',wd:4,items:[['ht','C'],['hsq','C'],['bss','S'],['le','I'],['lc','I'],['calf','I'],['abw','K']]},
 {name:'Arms & Delts',focus:'Optional 5th day',wd:5,opt:true,items:[['lat','I'],['rdf','I'],['fly','I'],['dip','S'],['skull','I',1],['dbcurl','I']]}];
const HYP_BLOCKS=[
 {n:'Foundation',w:'Weeks 1–4',d:'Learn the movements, set your baseline weights and build work capacity. Moderate reps, 2–3 reps left in the tank. Week 4 is a deload.'},
 {n:'Accumulation',w:'Weeks 5–8',d:'Volume climbs to 14–20 hard sets per muscle per week. Slightly heavier, and the last week pushes isolation sets to failure. Week 8 is a deload.'},
 {n:'Intensification',w:'Weeks 9–12',d:'Heavier compounds and drop sets on isolations for maximum tension. Week 12 tapers volume and tests your new top sets against week 1.'}];
const HYP_REPS={1:{C:'8-10',S:'10-12',I:'12-15',K:'10-15'},2:{C:'6-8',S:'8-10',I:'10-12',K:'10-15'},3:{C:'5-7',S:'6-8',I:'8-12',K:'12-15'}};
const HYP_SLOW=new Set(['bsq','rdl','ht','hsq']);
const LOWER_BIG=new Set(['bsq','rdl','lp','hsq','ht','dl','tbdl']);
function hypWeekInfo(w){const block=w<=4?1:w<=8?2:3,wi=(w-1)%4,deload=w===4||w===8,test=w===12;
  const rir=deload?4:test?2:[3,2,1][wi];
  return{w,block,wi,deload,test,rir,label:deload?'Deload':test?'Peak & test':HYP_BLOCKS[block-1].n+' · week '+(wi+1)}}
function hypSets(info,role){if(role==='K')return info.deload?2:3;const b=info.block,wi=info.wi;
  let n=role==='C'?(b===1?3:4):role==='S'?(b===2&&wi>0?4:3):(b===2&&wi===2?4:3);
  if(info.deload)n=Math.max(2,Math.ceil(n/2));if(info.test)n=role==='C'?3:2;return n}
function hypRest(exId,role){return role==='C'?(HYP_SLOW.has(exId)?180:150):role==='S'?120:role==='K'?60:75}
// one program session as a workout object the rest of the app already understands
function hypWorkout(id){const [,ws,ds]=String(id).split(':');const w=+ws,di=+ds,D=HYP_DAYS[di];if(!D||!(w>=1&&w<=12))return null;const info=hypWeekInfo(w);
  const main=[],acc=[];let firstC=true;
  D.items.forEach(([exId,role,link])=>{const ex=getEx(exId);const reps=HYP_REPS[info.block][role];const n=hypSets(info,role);const sets=[];
    const lastSetFail=!info.deload&&!info.test&&info.wi===2&&(role==='I'||role==='S');
    const rirTxt=r=>String(r);
    if(role==='C'&&firstC&&ex.cat==='strength'){sets.push({t:'W',reps:'10',w:'',pct:''},{t:'W',reps:'5',w:'',pct:''})}
    if(info.test&&role==='C'){sets.push({t:'N',reps:'3-5',w:'',pct:'',rir:'1'});for(let i=1;i<n;i++)sets.push({t:'N',reps:'6-8',w:'',pct:'',rir:'2'})}
    else for(let i=0;i<n;i++)sets.push({t:'N',reps,w:'',pct:'',rir:rirTxt(lastSetFail&&i===n-1?0:info.rir)});
    if(info.block===3&&!info.deload&&!info.test&&role==='I')sets.push({t:'D',reps:'max',w:'',pct:'',rir:'0'});
    const notes=[];
    if(info.deload)notes.push('Deload: use about 85% of last week’s weights, stop well short of failure');
    else if(info.test&&role==='C')notes.push('Test: work up to one top set of 3–5 reps, then 2 lighter back-off sets');
    else notes.push(`Leave ${info.rir} rep${info.rir===1?'':'s'} in the tank${lastSetFail?', last set to failure':''}`);
    if(info.block===3&&!info.deload&&!info.test&&role==='I')notes.push('drop set: cut the weight ~25% and rep out');
    if(role==='C'&&!info.test&&!info.deload)notes.push('add weight once every set hits '+topNum(reps)+' reps');
    const it={id:uid(),exId,link:!!link,rest:hypRest(exId,role),note:notes.join(' · '),mode:'w',sets,role};if(info.deload)it.loadK=.85;
    (role==='C'?main:acc).push(it);if(role==='C')firstC=false});
  const sections=[{id:'m',type:'regular',title:'Main lifts',items:main},{id:'a',type:'regular',title:'Hypertrophy work',items:acc}].filter(s=>s.items.length);
  return{id,name:`Wk ${w} · ${D.name}`,tags:['12-week build',D.focus],notes:info.label,sections,hyp:{w,d:di,info}}}
const isHypId=id=>String(id||'').startsWith('hyp:');
function hypDeloadId(id){if(!isHypId(id))return false;const w=+String(id).split(':')[1];return w===4||w===8}
function hypDayList(){const H=S.library.hyp;return H?HYP_DAYS.map((D,i)=>i).filter(i=>H.days===5||!HYP_DAYS[i].opt):[]}
function hypDate(w,di){return addDays(S.library.hyp.start,(w-1)*7+HYP_DAYS[di].wd)}
function hypDone(id){return allSessions().find(s=>s.workoutId===id)}
function hypCurWeek(){const H=S.library.hyp;if(!H)return 0;const d=Math.floor((parseISO(todayISO())-parseISO(H.start))/864e5);return Math.min(12,Math.max(1,Math.floor(d/7)+1))}
function hypAll(){const out=[];for(let w=1;w<=12;w++)for(const di of hypDayList())out.push({id:`hyp:${w}:${di}`,w,di,date:hypDate(w,di)});return out}
function hypNext(){const t=todayISO();const all=hypAll().filter(x=>!hypDone(x.id));return all.find(x=>x.date===t)||all.find(x=>x.date>=t)||all[0]||null}
function hypClearCal(){for(const d of Object.keys(S.calendar.days)){const a=S.calendar.days[d].filter(x=>!isHypId(x));if(a.length)S.calendar.days[d]=a;else delete S.calendar.days[d]}}
function hypSchedule(){hypClearCal();for(const x of hypAll())(S.calendar.days[x.date]=S.calendar.days[x.date]||[]).push(x.id);save('calendar')}

// weekly hard sets per muscle: primary muscles count 1, helpers 0.5
const VOL_MUSCLES=['chest','lats','upperback','shoulders','reardelts','biceps','triceps','quads','hamstrings','glutes','calves','abs'];
function addVol(v,exId,n){const m=musclesFor(getEx(exId));m.p.forEach(g=>v[g]=(v[g]||0)+n);m.s.forEach(g=>v[g]=(v[g]||0)+n*.5)}
function hypPlannedVol(w){const v={};for(const di of hypDayList()){const W=hypWorkout(`hyp:${w}:${di}`);W.sections.forEach(s=>s.items.forEach(it=>addVol(v,it.exId,it.sets.filter(x=>x.t!=='W').length)))}return v}
function doneVol(from,to){const v={};allSessions().filter(s=>s.date>=from&&s.date<=to).forEach(s=>(s.entries||[]).forEach(e=>addVol(v,e.exId,e.sets.filter(x=>x.t!=='W').length)));return v}
function volBars(plan,done){const rows=VOL_MUSCLES.filter(g=>(plan?plan[g]:0)||done[g]);if(!rows.length)return'<p class="muted sm">No sets yet.</p>';
  const max=24;return`<div class="vol">${rows.map(g=>{const p=plan?r1(plan[g]||0):null,d=r1(done[g]||0);const ref=p!=null?p:d;const zone=ref<10?'lo':ref>20?'hi':'ok';
    return`<div class="vrow"><span class="vl">${MUSCLE_LABEL[g]||g}</span><div class="vtrack"><i class="vz" style="left:${10/max*100}%;width:${10/max*100}%"></i>${p!=null?`<i class="vp" style="width:${Math.min(100,p/max*100)}%"></i>`:''}<i class="vd" style="width:${Math.min(100,d/max*100)}%"></i></div><span class="mono sm vn ${zone}">${p!=null?d+' / '+p:d}</span></div>`}).join('')}</div>
    <small>Green band = 10–20 hard sets a week, the range linked to the most growth. ${plan?'Dark bar = done this week, light bar = planned.':''} Helper muscles count as half a set.</small>`}

function bulkStatus(){const e=(S.body.entries||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));if(e.length<2)return null;const last=e[e.length-1].date;
  const avg=a=>a.reduce((s,x)=>s+ +x.v,0)/a.length;const A=e.filter(x=>x.date>addDays(last,-7)),B=e.filter(x=>x.date<=addDays(last,-7)&&x.date>addDays(last,-14));
  if(!A.length||!B.length)return{need:true};const a=avg(A),b=avg(B);return{a,b,rate:(a-b)/b*100}}
function bulkCard(){const p=S.profile,T=p.targets,bw=+p.weight||((S.body.entries||[]).slice(-1)[0]||{}).v;const st=bulkStatus();
  let h=`<div class="card"><div class="cardhead"><h2>${ico('food')}Muscle-gain nutrition</h2>${T?`<span class="mono sm">${fmt(T.kcal)} kcal · P ${T.p} g</span>`:''}</div>`;
  if(!T)h+=`<p class="muted" style="margin:0">Set lean-bulk targets: a 5–10% calorie surplus with 1.6–2.2 g of protein per kg is what the research supports for building muscle without much fat.</p>`;
  else{const pk=bw?T.p/bw:null;h+=`<div class="tiles"><div class="tile"><small>Protein per kg</small><b>${pk?r1(pk):'—'}</b><small>${pk==null?'add your weight':pk<1.6?'raise to 1.6+':'✓ in the 1.6–2.2 range'}</small></div>
    <div class="tile"><small>Protein per meal</small><b>${bw?fmt(bw*.4):'—'} g</b><small>× 4 meals, about 0.4 g/kg each</small></div>
    <div class="tile"><small>Weekly weight change</small><b>${st&&st.rate!=null?(st.rate>0?'+':'')+r1(st.rate)+'%':'—'}</b><small>${st&&st.rate!=null?(r1(st.a)+' vs '+r1(st.b)+' '+U()):'log weight 2+ weeks'}</small></div></div>`;
    if(st&&st.rate!=null){const r=st.rate;
      if(r<.1)h+=`<div class="tipbox"><b>Gaining too slowly.</b> Aim for +0.25–0.5% of body weight a week. Add about 150 kcal, mostly carbs around training. <button class="btn sm" data-act="bulkAdj" data-k="150">Add 150 kcal</button></div>`;
      else if(r>.6)h+=`<div class="tipbox warn"><b>Gaining fast.</b> Above about 0.5% a week, more of the gain is fat. Trim about 150 kcal. <button class="btn sm" data-act="bulkAdj" data-k="-150">Remove 150 kcal</button></div>`;
      else h+=`<div class="tipbox good"><b>On track.</b> A steady 0.1–0.6% a week is the lean-gain sweet spot. Keep targets as they are.</div>`}
    else h+=`<small>Weigh in 3+ mornings a week (after the toilet, before eating) in Progress. After two weeks, this card tells you whether to adjust calories.</small>`}
  return h+`<div class="row"><button class="btn ${T?'ghost ':''}sm" data-act="hypMacros">${T?'Recalculate lean-bulk targets':'Set lean-bulk targets'}</button><button class="btn ghost sm" data-act="toDaily">Edit daily targets ↑</button></div></div>`}

function vBuild(){const H=S.library.hyp;
  let h='';
  if(!H){h+=`<div class="card hypintro"><p style="margin:0">A 12-week hypertrophy program built on the training variables with the strongest research behind them. Every session has photos showing the muscles worked, step-by-step technique, set and rep targets, rest times and logging that suggests your next weights.</p>
    <div class="princ">${[['2× a week','Each muscle trained twice a week. That beats once a week when total sets are equal.'],['10–20 sets','Hard sets per muscle per week, increasing block by block.'],['0–3 RIR','Sets end 0–3 reps short of failure. Effort is what drives growth.'],['Double progression','Hit the top of the rep range on every set, then add weight. The app prompts you.'],['Deloads','Weeks 4 and 8 halve the volume so fatigue clears and gains show.'],['Test week','Week 12 retests your top sets so you can see the progress.']].map(([a,b])=>`<div><b>${a}</b><small>${b}</small></div>`).join('')}</div>
    <div class="blocks">${HYP_BLOCKS.map((b,i)=>`<div class="blk b${i+1}"><span class="eyebrow">${b.w}</span><b>${b.n}</b><small>${b.d}</small></div>`).join('')}</div>
    <div class="row"><label>Start on (Monday)<input type="date" id="hypStart" value="${weekStart(addDays(todayISO(),weekday(todayISO())>2?7:0))}"></label>
    <label>Days per week<select id="hypDays" style="width:auto"><option value="4">4 days: Upper/Lower ×2</option><option value="5">5 days: + Arms & Delts</option></select></label>
    <button class="btn" data-act="hypStartProg">Start the 12 weeks</button></div><small>Schedule: Mon Upper A · Tue Lower A · Thu Upper B · Fri Lower B · (Sat Arms & Delts). The sessions go on your calendar and Today screen.</small></div>`;
    h+=`<h2>The sessions</h2><div class="rgrid">${HYP_DAYS.map((D,di)=>`<button class="card hday" data-act="hypPreview" data-id="hyp:1:${di}"><div class="figstrip">${D.items.slice(0,4).map(([id])=>`<div class="figbox">${exPic(getEx(id))}</div>`).join('')}</div><b>${D.name}${D.opt?' <span class="chip">optional</span>':''}</b><small>${D.focus} · ${D.items.length} exercises</small></button>`).join('')}</div>`;
    return h+bulkCard()}
  const cw=hypCurWeek(),info=hypWeekInfo(cw),all=hypAll(),done=all.filter(x=>hypDone(x.id)).length,nx=hypNext(),t=todayISO();
  h+=`<div class="card"><div class="cardhead"><div><div class="eyebrow">Week ${cw} of 12 · Block ${info.block}: ${HYP_BLOCKS[info.block-1].n}</div><h2>${esc(info.label)}</h2></div><span class="mono">${done}/${all.length} sessions</span></div>
    <div class="pbar"><i style="width:${done/all.length*100}%"></i></div>
    ${nx?`<div class="wcard hypnext"><div class="figstrip">${HYP_DAYS[nx.di].items.slice(0,3).map(([id])=>`<div class="figbox">${exPic(getEx(id))}</div>`).join('')}</div><div class="grow"><small>${nx.date===t?'Today':nx.date<t?'Missed · '+shortDate(nx.date):longDay(nx.date)+' '+shortDate(nx.date)}</small><br><b>Week ${nx.w} · ${HYP_DAYS[nx.di].name}</b><br><small>${HYP_DAYS[nx.di].focus}</small></div><button class="btn ghost sm" data-act="hypPreview" data-id="${nx.id}">Preview</button><button class="btn sm" data-act="start" data-id="${nx.id}" data-d="${nx.date<=t?t:nx.date}">Start</button></div>`:`<div class="pr">🏆 <span><b>Program complete!</b> Compare your key lifts below, then start again with heavier weights.</span></div>`}</div>`;
  // grid
  const days=hypDayList();
  h+=`<div class="card"><div class="cardhead"><h2>${ico('cal')}12-week log</h2><span class="legend"><span><i class="lg done"></i>Done</span><span><i class="lg miss"></i>Missed</span><span><i class="lg dl"></i>Deload</span></span></div><div class="hgrid" style="--nd:${days.length}"><span></span>${days.map(di=>`<span class="hh">${HYP_DAYS[di].name.replace('Arms & Delts','Arms')}</span>`).join('')}`;
  for(let w=1;w<=12;w++){const wi=hypWeekInfo(w);h+=`<span class="hw ${w===cw?'cur':''}">W${w}</span>`;
    for(const di of days){const id=`hyp:${w}:${di}`,d=hypDate(w,di),s=hypDone(id);const st=s?'done':d<t?'miss':d===t?'today':'';
      h+=`<button class="hc ${st} ${wi.deload?'dl':''} ${wi.test?'ts':''}" data-act="${s?'viewSess':'hypPreview'}" data-id="${s?s.id:id}" title="${esc(`Week ${w} ${HYP_DAYS[di].name}, ${shortDate(d)}`)}">${s?'✓':parseISO(d).getDate()}</button>`}}
  h+=`</div><small>Tap a session to preview or start it. Missed sessions can be done any time; just keep the order.</small></div>`;
  // volume
  const ws=addDays(H.start,(cw-1)*7);h+=`<div class="card"><div class="cardhead"><h2>${ico('progress')}Weekly volume</h2><span class="muted sm">Week ${cw} · hard sets per muscle</span></div>${volBars(hypPlannedVol(cw),doneVol(ws,addDays(ws,6)))}</div>`;
  // key lifts
  const keys=[...new Set(HYP_DAYS.flatMap(D=>D.items.filter(x=>x[1]==='C').map(x=>x[0])))].filter(id=>getEx(id).cat==='strength');
  const hs=allSessions().filter(s=>isHypId(s.workoutId)&&s.date>=H.start);
  const rows=keys.map(id=>{let first=0,best=0;hs.forEach(s=>(s.entries||[]).filter(e=>e.exId===id).forEach(e=>{const b=Math.max(0,...e.sets.map(e1));if(b){if(!first)first=b;best=Math.max(best,b)}}));return{id,first,best}});
  h+=`<div class="card"><div class="cardhead"><h2>${ico('progress')}Key lifts</h2><span class="muted sm">Estimated 1RM, first session vs best</span></div>${rows.map(r=>`<div class="lrow"><span class="thumb">${exPic(getEx(r.id))}</span><div class="grow"><b>${esc(getEx(r.id).name)}</b><small>${r.first?`${r1(r.first)} → ${r1(r.best)} ${U()}`:'Not logged yet'}</small></div>${r.first&&r.best>r.first?`<span class="chip good">+${r1((r.best/r.first-1)*100)}%</span>`:''}</div>`).join('')}</div>`;
  h+=`<div class="blocks">${HYP_BLOCKS.map((b,i)=>`<div class="blk b${i+1} ${info.block===i+1?'on':''}"><span class="eyebrow">${b.w}</span><b>${b.n}</b><small>${b.d}</small></div>`).join('')}</div>`;
  return h+bulkCard()+`<div class="row" style="justify-content:flex-end"><button class="btn ghost sm danger" data-act="hypStop" data-confirm="1">End 12-week program</button></div>`}

function mHypDay(m){const W=hypWorkout(m.id);if(!W)return mhead('Session');const {w,d,info}=W.hyp;const H=S.library.hyp;const date=H?hypDate(w,d):todayISO();const s=H&&hypDone(m.id);const t=todayISO();
  let h=mhead(esc(W.name))+`<small>${esc(HYP_DAYS[d].focus)} · ${esc(info.label)}${H?' · '+longDay(date)+' '+shortDate(date):''}</small>
  <div class="tipbox">${info.deload?'<b>Deload week.</b> Half the sets at about 85% of your weights. Leave the gym feeling fresh; this is when the growth catches up.':info.test?'<b>Test week.</b> Work up to a heavy top set of 3–5 reps on the main lifts and compare your estimated 1RM with week 1.':`<b>Effort:</b> finish each set with about ${info.rir} rep${info.rir===1?'':'s'} left in the tank (RIR ${info.rir}). When you hit the top of the rep range on every set, the app suggests more weight next time.`}</div>`;
  W.sections.forEach(sec=>{h+=`<div class="eyebrow">${esc(sec.title)}</div>`;const labels=groupLabels(sec.items);
    sec.items.forEach((it,i)=>{const ex=getEx(it.exId);const ws=it.sets.filter(x=>x.t==='N'),wu=it.sets.filter(x=>x.t==='W').length,dr=it.sets.some(x=>x.t==='D');
      const reps=[...new Set(ws.map(x=>x.reps))].join(' / ');
      h+=`<div class="hex ${it.link?'linked':''}"><button class="hexph" data-act="exInfo" data-id="${ex.id}" aria-label="How to do ${esc(ex.name)}">${exPic(ex)}</button><div class="grow"><span class="lab">${labels[i]}</span> <b>${esc(ex.name)}</b>
        <div class="mono sm">${wu?wu+' warm-up + ':''}${ws.length} × ${esc(reps)}${dr?' + drop set':''} · RIR ${esc(ws[ws.length-1]?.rir??info.rir)} · rest ${it.link&&i<sec.items.length-1?'none, superset':it.rest+'s'}</div>
        <small>${esc(it.note)}</small><br><button class="linkbtn" data-act="exInfo" data-id="${ex.id}">Technique, muscles & mistakes →</button></div></div>`})});
  h+=`<div class="row">${s?`<button class="btn ghost" data-act="viewSess" data-id="${s.id}">✓ View logged session</button>`:`<button class="btn" data-act="start" data-id="${m.id}" data-d="${date<=t?t:date}">Start this session</button>`}</div>`;
  return h}

function neonChart(pts,unit,o={}){if(pts.length<2)return`<p class="muted sm">Log this at least twice to see a trend.</p>`;const id='nc'+(++CHID);
  const W=680,H=230,pl=46,pr=24,pt=22,pb=30;const xs=pts.map(p=>parseISO(p.x).getTime()),ys=pts.map(p=>+p.y);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0)x1=x0+864e5;let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*.18||Math.max(1,y1*.05);y0-=pad;y1+=pad;
  const X=t=>pl+(t-x0)/(x1-x0)*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  // smooth path (Catmull-Rom to Bezier)
  const P=pts.map((p,i)=>[X(xs[i]),Y(ys[i])]);let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=`C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}
  const area=d+`L${P[P.length-1][0].toFixed(1)},${H-pb}L${P[0][0].toFixed(1)},${H-pb}Z`;const li=P.length-1;
  let best=-Infinity;const prs=[];ys.forEach((y,i)=>{if(y>best){if(i>0&&o.prs)prs.push(i);best=y}});
  const ticks=[0,.5,1].map(f=>y0+(y1-y0)*f);const c=o.color||'warm';
  return`<svg class="nchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend from ${ys[0]} to ${ys[li]} ${unit}">

  <g class="ngrid">${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${pl-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${r1(v)}</text>`).join('')}</g>
  <path d="${area}" fill="url(#${id}a)" class="narea"/><path d="${d}" fill="none" stroke="url(#${id}l)" stroke-width="3.5" stroke-linecap="round" filter="url(#${id}g)" class="nline" pathLength="1"/>
  ${pts.length<=40?P.slice(0,-1).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" class="ndot"/>`).join(''):''}
  ${prs.map(i=>`<g class="npr" transform="translate(${P[i][0].toFixed(1)},${P[i][1].toFixed(1)})"><path d="M0,-8 L2.4,-2.4 8,0 2.4,2.4 0,8 -2.4,2.4 -8,0 -2.4,-2.4Z"/></g>`).join('')}
  <circle cx="${P[li][0].toFixed(1)}" cy="${P[li][1].toFixed(1)}" r="9" class="nend-h"/><circle cx="${P[li][0].toFixed(1)}" cy="${P[li][1].toFixed(1)}" r="5" class="nend"/>
  <g transform="translate(${Math.min(W-pr-74,P[li][0]-37).toFixed(1)},${Math.max(2,P[li][1]-36).toFixed(1)})"><rect width="74" height="22" rx="11" class="nbub"/><text x="37" y="15" text-anchor="middle" class="nbubt">${ys[li]} ${unit}</text></g>

async function ahImport(file,onPct){const sc=ahScanner(60),dec=new TextDecoder();let got=0,lastP=-1;const size=file.size||1;

  const s=+r.servings||1;return{kcal:t.kcal/s,p:t.p/s,c:t.c/s,f:t.f/s}}
function recipeTags(r){const fm=foodMap();const t=new Set();(r.ing||[]).forEach(([fid])=>(fm[fid]?.tags||[]).forEach(x=>t.add(x)));return[...t]}

function plannedFor(d,cat){const w=S.nutrition.weeks[weekStart(d)];return(w&&w.days&&w.days[weekday(d)]&&w.days[weekday(d)][cat])||[]}

function calcTargets(p){const w=+p.weight,h=+p.height,a=+p.age;if(!w||!h||!a)return null;
  const bmr=10*w+6.25*h-5*a+(p.sex==='female'?-161:5); // Mifflin-St Jeor
  const tdee=bmr*(+p.activity||1.55);
  const adj={cut:-.2,lean:-.1,maintain:0,gain:.1}[p.goal]||0;
  const kcal=Math.round(tdee*(1+adj)/10)*10;
  const prot=Math.round(+p.bf?w*(1-p.bf/100)*2.4:w*({cut:2.2,lean:2.0}[p.goal]||1.8));
  const fat=Math.round(kcal*.25/9);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const kcalR=Math.round(kcal*.9/10)*10;const carbR=Math.max(0,Math.round((kcalR-prot*4-fat*9)/4));
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),adj,train:{kcal,p:prot,c:carb,f:fat},rest:{kcal:kcalR,p:prot,c:carbR,f:fat}}}

/* ================= meal plan generator ================= */
function fitScore(r,t,mode,noise=.15){const m=recipeMacros(r);if(!m.kcal)return{sv:1,score:99};let sv=Math.round(t.kcal/m.kcal*2)/2;sv=Math.min(3,Math.max(1,sv));
  const e=(a,b)=>Math.abs(a-b)/Math.max(b,1);let score=e(m.kcal*sv,t.kcal);
  if(mode!=='kcal')score+=e(m.p*sv,t.p)*1.2;if(mode==='all')score+=(e(m.c*sv,t.c)+e(m.f*sv,t.f))*.5;
  return{sv,score:score+Math.random()*noise}}
function genPool(){const G=S.nutrition.gen;return allRecipes().filter(r=>(G.source==='all'||(G.source==='mine'?r.custom:!r.custom))&&!recipeTags(r).some(t=>G.exclude.includes(t)))}
function genWeek(wk,onlyDay=null){const G=S.nutrition.gen,mode=S.profile.macroMode;const cats=MEALS.filter(c=>G.meals[c]);const pool=genPool();
  const week=ensureWeek(wk);const days=+G.days===5?5:7;const fixed={},used={};cats.forEach(c=>used[c]=new Set());
  if(onlyDay!=null){for(let di=0;di<7;di++)if(di!==onlyDay)cats.forEach(c=>(week.days[di]?.[c]||[]).forEach(x=>used[c].add(x.r)))}
  const list=onlyDay!=null?[onlyDay]:[...Array(days).keys()];let filled=0;
  for(const di of list){const date=addDays(wk,di);const T=targetsBase(date);if(!T)continue;week.days[di]=week.days[di]||{};
    for(const cat of cats){const share=(+G.split[cat]||0)/100;if(!share)continue;const tgt=scaleM(T,share);
      const cands=pool.filter(r=>r.meal.includes(cat));if(!cands.length)continue;
      const scored=cands.map(r=>({r,...fitScore(r,tgt,mode)})).sort((a,b)=>a.score-b.score);let pick;
      if(G.variety==='daily'||onlyDay!=null){const fresh=scored.filter(x=>!used[cat].has(x.r.id));const top=(fresh.length?fresh:scored).slice(0,3);pick=top[Math.floor(Math.random()*top.length)]}
      else{const n=+G.variety;if(!fixed[cat])fixed[cat]=shuffle(scored.slice(0,Math.max(n,3))).slice(0,n);const r=fixed[cat][di%fixed[cat].length].r;pick={r,...fitScore(r,tgt,mode,0)}}
      used[cat].add(pick.r.id);week.days[di][cat]=[{r:pick.r.id,sv:pick.sv}];filled++}}
  save('nutrition');return filled}
function genFlex(){const G=S.nutrition.gen,mode=S.profile.macroMode,T=S.profile.targets;if(!T)return 0;const pool=genPool();let n=0;
  for(const cat of MEALS){if(!G.meals[cat])continue;const tgt=scaleM(T,(+G.split[cat]||0)/100);
    const top=pool.filter(r=>r.meal.includes(cat)).map(r=>({r,...fitScore(r,tgt,mode,.3)})).sort((a,b)=>a.score-b.score).slice(0,4);
    S.nutrition.flex[cat]=top.map(x=>x.r.id);n+=top.length}
  save('nutrition');return n}

function itemHTML(sec,si,it,i,lab){const ex=getEx(it.exId),reg=sec.type==='regular',last=i===sec.items.length-1,alts=itemAlts(it);const d=`data-s="${si}" data-i="${i}"`;

function mkLive(w,date){const L={id:uid(),date,workoutId:w.id,name:w.name,started:Date.now(),sections:clone(w.sections).map(sec=>({...sec,result:'',roundsDone:0,
  items:sec.items.map(it=>({...it,origEx:it.exId,alts:itemAlts(it),sets:it.sets.map(st=>({plan:st,t:st.t||'N',done:false,w:'',reps:'',rpe:'',rir:'',time:'',dist:'',sug:{}}))}))}))};
  L.sections.forEach(sec=>{if(sec.type==='regular')sec.items.forEach(it=>suggestItem(it))});return L}
function suggestItem(it){const ex=getEx(it.exId);const last=lastSets(it.exId,true);const orm=ex.cat==='strength'?oneRM(it.exId):null;const typeIdx={};
  // double progression: every working set hit the top of the range last time -> add one increment (two for big lower-body lifts)
  let bump=0;const pr0=String((it.sets.find(s=>s.t==='N')||{plan:{}}).plan.reps||'');
  if(ex.cat==='strength'&&last&&!it.loadK&&/\d+\s*-\s*\d+/.test(pr0)){const lw=last.sets.filter(x=>(x.t||'N')==='N');if(lw.length&&lw.every(x=>(x.reps||0)>=topNum(pr0)&&x.w>0))bump=(+S.profile.inc||2.5)*(LOWER_BIG.has(ex.id)?2:1)}
  it.bump=bump;
  it.sets.forEach(st=>{if(st.done)return;const p=st.plan;const ti=typeIdx[st.t]=(typeIdx[st.t]??-1)+1;st.sug={};
    const lastSame=last?last.sets.filter(x=>(x.t||'N')===st.t):[];const lm=lastSame[ti]||lastSame[lastSame.length-1];
    // weight
    if(p.w!==''&&p.w!=null&&p.w!==undefined&&String(p.w).trim()!=='')st.w=String(p.w);
    else if(it.mode==='pct'&&p.pct&&orm){st.w=String(roundW(orm*(+p.pct)/100));st.sug.w=true}
    else if(lm&&lm.w){const b=+lm.w;st.w=String(it.loadK?roundW(b*it.loadK):st.t==='N'&&bump?b+bump:b);st.sug.w=true}
    else if(orm&&topNum(p.reps)){st.w=String(roundW(orm/(1+topNum(p.reps)/30)));st.sug.w=true}
    else st.w='';
    // reps
    const pr=String(p.reps||'');if(/^\s*\d+\s*$/.test(pr))st.reps=pr.trim();else if(lm&&lm.reps){st.reps=String(lm.reps);st.sug.reps=true}else st.reps='';
    ['time','dist'].forEach(k=>{if(p[k])st[k]=String(p[k]);else if(lm&&lm[k]){st[k]=String(lm[k]);st.sug[k]=true}else st[k]=''});
    ['rpe','rir'].forEach(k=>st[k]=p[k]?String(p[k]):'')})}
function vLive(){const L=S.live;
  let h=`<div class="livehead"><div><div class="eyebrow">In progress · <span id="liveClock" class="mono">${clock((Date.now()-L.started)/1000)}</span></div><h1>${esc(L.name)}</h1></div><div class="tools"><button class="btn ghost" data-act="restOpen">⏱ Rest</button><button class="btn ghost" data-act="liveHide">Minimise</button><button class="btn" data-act="liveFinish">Finish</button></div></div>
  <small>Grey italic values are suggestions from your last session or your estimated 1RM. Typing a value fills the empty sets below it. Tick a set to confirm it and start the rest timer.</small>`;

  else{const el2=(T.paused!=null?T.paused:Date.now()-T.start)/1000;h=`<div class="phase">For time · ${sec.rounds} rounds${sec.timeCap?' · cap '+sec.timeCap+' min':''}</div><div class="big">${clock(el2)}</div><div class="counter"><button class="iconbtn" style="color:inherit;border-color:currentColor;height:52px;min-width:52px" data-act="timedRound" data-d="-1" aria-label="Previous round">−</button><div><b>${T.round}</b><div class="muted">round of ${sec.rounds}</div></div><button class="iconbtn" style="color:inherit;border-color:currentColor;height:52px;min-width:52px" data-act="timedRound" data-d="1" aria-label="Next round">+</button></div>`}
  h+=`<div class="tools">${T.kind==='timed'?'<button class="prim" data-act="tDone">Done – record time</button>':''}<button data-act="tPause">${T.paused!=null?'Resume':'Pause'}</button>${T.kind==='interval'?'<button data-act="tSkip">Skip</button>':''}<button data-act="tStop">${T.kind==='amrap'?'End & record':'Stop'}</button></div>`;

  if(T.kind==='interval'){if(Date.now()>=T.end){T.idx++;if(T.idx>=T.seq.length){beep(990,.5);sec.result=`${sec.rounds} rounds completed`;S.timer=null;persistLive();render();return}beep(T.seq[T.idx].phase==='work'?880:520,.25);T.end=Date.now()+T.seq[T.idx].dur*1000}}

function lineChart(pts,unit){if(pts.length<2)return`<p class="muted sm">Log this at least twice to see a trend.</p>`;
  const W=640,H=200,pl=48,pr=18,pt=14,pb=28;const xs=pts.map(p=>parseISO(p.x).getTime()),ys=pts.map(p=>+p.y);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0)x1=x0+864e5;let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*.15||Math.max(1,y1*.05);y0-=pad;y1+=pad;
  const X=t=>pl+(t-x0)/(x1-x0)*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join('');
  const area=path+`L${X(xs[xs.length-1]).toFixed(1)},${H-pb}L${X(xs[0]).toFixed(1)},${H-pb}Z`;
  const ticks=[0,.5,1].map(f=>y0+(y1-y0)*f);const li=pts.length-1;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend from ${ys[0]} to ${ys[li]} ${unit}"><g class="grid">${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${pl-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${r1(v)}</text>`).join('')}</g>
  <path class="area" d="${area}"/><path class="line" d="${path}"/>${pts.length<=30?pts.slice(0,-1).map((p,i)=>`<circle class="pt" cx="${X(xs[i]).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="3"/>`).join(''):''}
  <circle class="end" cx="${X(xs[li]).toFixed(1)}" cy="${Y(ys[li]).toFixed(1)}" r="5"/><text x="${pl}" y="${H-8}">${shortDate(pts[0].x)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end">${shortDate(pts[li].x)} · ${ys[li]} ${unit}</text></svg>`}

function parseNIP(txt){const d=sdBlank();d.src='ocr';const t=String(txt).replace(/[|]/g,' ').replace(/(\d),(\d{3})(?!\d)/g,'$1$2').replace(/(\d)\s*,(\d)/g,'$1.$2').replace(/(\d)[Oo]|[Oo](\d)/g,(m,a,b)=>a!=null?a+'0':'0'+b);
  const lines=t.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const nums=s=>(s.match(/\d+(?:\.\d+)?\s*(?:kj|kcal|cal|mg|g)?/gi)||[]).map(x=>({v:parseFloat(x),u:(x.match(/[a-z]+$/i)||[''])[0].toLowerCase()})).filter(x=>x.u!=='mg');
  const ss=t.match(/serv(?:ing|e)\s*size[^\d]{0,12}(\d+(?:\.\d+)?)\s*(g|ml)/i);if(ss)d.serveG=+ss[1];
  const row=(re,not)=>{const l=lines.find(s=>re.test(s)&&!(not&&not.test(s)));return l?nums(l.replace(re,'')):null};
  const put=(k,arr,conv)=>{if(!arr||!arr.length)return;const a=arr.map(x=>conv?conv(x):x.v).filter(v=>v!=null&&isFinite(v));if(a.length>=2){d.serve[k]=r1(a[0]);d.per100[k]=r1(a[1])}else if(a.length===1)d.per100[k]=r1(a[0])};
  const en=row(/energy/i);if(en){const kj=en.filter(x=>x.u==='kj'),kc=en.filter(x=>/cal/.test(x.u));put('kcal',kc.length?kc:kj.length?kj.map(x=>({v:x.v/4.184})):en.map(x=>({v:x.v>900?x.v/4.184:x.v})))}
  put('p',row(/protein/i));put('f',row(/fat\W*(?:,|-)?\s*total|^\s*total\s*fat|^\s*fat\b/i,/saturat|trans/i));put('c',row(/carbohydrate|carbs/i,/sugar/i));
  const nm=lines.find(s=>/^[a-z][a-z '&.-]{2,}$/i.test(s)&&!/\d/.test(s)&&!/nutrition|information|serv|energy|protein|fat|carb|sugar|sodium|saturat|trans|fibre|fiber|gluten|per 100|quantity|average|ingredients|package/i.test(s));if(nm)d.name=nm.slice(0,50);
  return sdFinish(d)}

  if(p.includes('.')){const [col,k]=p.split('.');d[col][k]=v===''?null:+v;if(d.serveG){const to=col==='serve'?'per100':'serve';d[to][k]=v===''?null:r1(+v*(col==='serve'?100/d.serveG:d.serveG/100));const j=document.getElementById(`sd-${to}-${k}`);if(j)j.value=d[to][k]??''}}

  const nx=ids.find(w=>!sessionsOn(d).some(s=>s.workoutId===w.id));
  return heroHTML('today',{eyebrow:isT?prettyDate(d):longDay(d)+' '+prettyDate(d),title:isT?greet():longDay(d),sub:nx?`On the plan: <b>${esc(nx.name)}</b>. ${esc((nx.tags||[])[1]||'')}`:train?'Training day: your sessions are below.':'Rest day. Recovery is when the muscle gets built.',
    stats,extra:(isT?'<button class="btn ghost pepbtn" data-act="pepOpen">▶ Pep talk</button>':'')+(nx&&isT?`<button class="btn" data-act="start" data-id="${nx.id}" data-d="${d}">Start ${esc(nx.name)} →</button>`:'')})}

function foodHero(){const d=todayISO(),T=targetsFor(d),day=foodDay(d,false),tot=sumM(MEALS.flatMap(m=>day[m]||[]));
  return heroHTML('food',{eyebrow:'Nutrition',title:'Fuel the build',sub:T?`${isTraining(d)?'Training':'Rest'}-day target: ${fmt(T.kcal)} kcal · ${T.p} g protein.`:'Set your targets and the planner builds meals around them.',
    stats:T?[[fmt(tot.kcal)+' / '+fmt(T.kcal),'kcal today'],[fmt(tot.p)+' / '+T.p+' g','protein'],[fmt(tot.c)+' g','carbs'],[fmt(tot.f)+' g','fat']]:[],extra:'<button class="btn" data-act="scanFor">📷 Scan a food label</button>'})}
// rest timer actions
A.restOpen=()=>openModal({kind:'restTimer'});
A.restGo=el=>{closeAll();startRest(+el.dataset.s)};
A.restGoCustom=()=>{const v=Math.max(5,Math.round(+$('#restCustom').value||75));S.profile.lastRest=v;save('profile');closeAll();startRest(v)};
A.restAdj=el=>{if(!S.rest)return;S.rest.end+=(+el.dataset.d)*1000;const left=(S.rest.end-Date.now())/1000;if(left>S.rest.total)S.rest.total=Math.ceil(left);if(left<=0)S.rest=null;renderRest()};
C.autoRest=el=>{S.profile.autoRest=el.checked;save('profile')};

/* ================= events ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.dataset.confirm&&!el.dataset.armed){e.preventDefault();el.dataset.armed='1';el._t=el.innerHTML;el.innerHTML=el.classList.contains('iconbtn')?'Sure?':'Tap again to confirm';el.classList.add('armed');setTimeout(()=>{if(el.isConnected&&el.dataset.armed){delete el.dataset.armed;el.innerHTML=el._t;el.classList.remove('armed')}},3000);return}
  const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el,e)}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal()});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.c&&C[el.dataset.c]){C[el.dataset.c](el);return}
  if(el.tagName==='SELECT'){if(el.dataset.b){bindB(el);if(el.dataset.b==='s.type')render()}else if(el.dataset.p)bindP(el);else if(el.dataset.ri)bindRI(el)}});
document.addEventListener('input',e=>{const el=e.target;if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='radio')return;const d=el.dataset;
  if(d.b)bindB(el);else if(d.l)bindLive(el);else if(d.td)bindTD(el);else if(d.p)bindP(el);else if(d.r)bindR(el);else if(d.ri)bindRI(el);else if(d.q&&Q[d.q])Q[d.q](el)});
function bindB(el){const W=S.ui.editing;if(!W)return;const [scope,key]=el.dataset.b.split('.');const s=+el.dataset.s,i=+el.dataset.i,k=+el.dataset.k;let v=el.value;
  if(scope==='w'){W[key]=key==='tags'?v.split(',').map(x=>x.trim()).filter(Boolean):v;return}
  const sec=W.sections[s];if(scope==='s'){sec[key]=['rounds','work','rest','timeCap'].includes(key)?(v===''?'':+v):v;
    if(key==='type')sec.items.forEach(it=>{if(v!=='regular'){it.sets=it.sets.slice(0,1);it.link=false}});return}
  const it=sec.items[i];if(scope==='i'){it[key]=key==='rest'?(+v||0):v;return}
  if(scope==='k')it.sets[k][key]=v}

setInterval(()=>{if(S.live){const c=$('#liveClock');if(c)c.textContent=clock((Date.now()-S.live.started)/1000)}if(S.rest)renderRest();if(S.timer)timerTick()},250);

/* ================= boot ================= */
requestAnimationFrame(animFigs);
(function boot(){const local=lsGet(LS);if(local)Object.assign(S,local);normalize();const lv=lsGet(LS_LIVE);if(lv&&lv.sections)S.live=lv;render();setSync();setTimeout(()=>{if(shouldSplash()){S.ui.splash=true;lsSet('pb.splash',todayISO());renderSplash()}},500);
  (async()=>{await Store.init();if(Store.mode==='cloud'){const remote=await Store.loadAll();
      if(remote&&Object.keys(remote).length){applyDocs(remote);normalize();writeLocal();if(!S.ui.editing&&!S.ui.progEdit)render()}
      else if(remote&&local)docNames().forEach(n=>Store.flush(n))}
    setSync()})()})();
